<!DOCTYPE html>
<html>
<head>
    <title>Video Test</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: #f5f5f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        video { 
            max-width: 600px; 
            width: 100%; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Player Test</h1>
        <video controls preload="metadata" playsinline>
            <source src="videos/TuringForce-Pravin Video .mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <p style="margin-top: 20px; color: #666;">Click the play button to test the video</p>
    </div>
</body>
</html>
